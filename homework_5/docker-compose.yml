services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-demo_local_only}
      POSTGRES_DB: demo
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U demo -d demo']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  node-api:
    build: ./node-api
    environment:
      PGHOST: db
      PGUSER: demo
      PGPASSWORD: ${DB_PASSWORD:-demo_local_only}
      PGDATABASE: demo
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  python-api:
    build: ./python-api
    environment:
      PGHOST: db
      PGUSER: demo
      PGPASSWORD: ${DB_PASSWORD:-demo_local_only}
      PGDATABASE: demo
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  nginx:
    image: nginx:1.28-alpine
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      node-api:
        condition: service_healthy
      python-api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1/']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  pg_data:
