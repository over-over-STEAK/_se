<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Planner｜作業排程助手</title>
<style>
:root{font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#22352e;background:#f4f6f2;line-height:1.6}*{box-sizing:border-box}body{margin:0}header{background:#183e32;color:white;padding:32px max(24px,calc((100vw - 1160px)/2));}header small{color:#b9d3c1;letter-spacing:3px}h1{margin:8px 0;font-size:32px}header p{color:#d0dfd5;margin:0}main{max-width:1208px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}.stat,.panel{background:white;border:1px solid #dde5dc;border-radius:16px;padding:24px}.stat strong{display:block;font-size:30px;color:#245b42}.stat span,.muted{color:#68786f;font-size:14px}.layout{display:grid;grid-template-columns:330px 1fr;gap:22px;align-items:start}h2{font-size:20px;margin:0 0 18px}label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}input,select,button{font:inherit}input,select{width:100%;padding:10px 12px;border:1px solid #cbd8cd;border-radius:8px;background:white;color:#22352e}button,.filebutton{border:1px solid #ccd9ce;border-radius:8px;background:white;color:#224e38;padding:9px 14px;cursor:pointer;font-size:14px;display:inline-block}button:hover,.filebutton:hover{background:#edf3ec}button.primary{background:#285c43;color:white;border-color:#285c43}button:focus-visible,input:focus-visible,select:focus-visible,.filebutton:focus-within{outline:3px solid #e5b354;outline-offset:2px}.wide{width:100%;margin-top:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.task{border-top:1px solid #e5ebe4;padding:17px 0}.task:first-child{border-top:0}.task h3{font-size:16px;margin:0;overflow-wrap:anywhere}.taskhead{display:flex;justify-content:space-between;gap:12px}.badge{font-size:12px;border-radius:6px;padding:3px 8px;background:#eef3ed;white-space:nowrap;height:fit-content}.late{color:#9a4429;background:#fff0e8}.task .toolbar{margin-top:10px}.task button{font-size:12px;padding:5px 9px}progress{width:100%;height:7px;accent-color:#43815e}.section{margin-top:22px}.empty{text-align:center;padding:32px 12px;color:#748077}.day{background:#f6f8f3;border-radius:10px;padding:15px;margin-top:12px}.day h3{font-size:15px;margin:0 0 6px}.entry{display:flex;justify-content:space-between;gap:16px;padding:6px 0;overflow-wrap:anywhere}.entry span:last-child{white-space:nowrap;color:#35664a}.warning{background:#fff2e5;border-left:3px solid #c07d38;border-radius:6px;padding:10px 14px;margin-top:10px;font-size:14px}#status{min-height:25px;color:#376749;padding-top:12px}footer{font-size:12px;color:#79867c;margin:24px 0;text-align:center}.filebutton{margin:0;font-weight:400;position:relative}.filebutton input{position:absolute;inset:0;opacity:0;cursor:pointer}.hint{font-size:12px;color:#758177}dialog{border:0;border-radius:16px;max-width:420px;width:90%;padding:26px;box-shadow:0 20px 80px #0003}dialog::backdrop{background:#183e3270}.dialogactions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}@media(max-width:800px){.layout{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:25px}main{padding:16px}h1{font-size:27px}.panel{padding:19px}}
</style></head><body>
<header><small>STUDY PLANNER</small><h1>讓每一份作業，都有安排。</h1><p>看清期限、分配時間，從今天的一小步開始。</p></header>
<main><div class="top"><div><strong id="today"></strong><div class="muted">你的個人作業與讀書計畫</div></div><div class="toolbar"><button id="demo">加入示範作業</button><button id="backup">下載備份</button><label class="filebutton">匯入備份<input id="import" type="file" accept="application/json,.json" aria-label="匯入 JSON 備份"></label></div></div>
<div id="status" role="status" aria-live="polite"></div><div class="stats"><div class="stat"><span>待完成作業</span><strong id="pending">0</strong></div><div class="stat"><span>剩餘工作時數</span><strong id="hours">0</strong></div><div class="stat"><span>已完成作業</span><strong id="done">0</strong></div></div>
<div class="layout"><aside><section class="panel"><h2>＋ 新增作業</h2><form id="add"><label for="title">作業名稱</label><input id="title" maxlength="100" placeholder="例如：數位邏輯作業" required><label for="due">截止日期</label><input id="due" type="date" required><label for="estimate">預估剩餘時數</label><input id="estimate" type="number" min="0.1" max="10000" step="0.1" value="2" required><button class="primary wide">新增到我的清單</button></form></section><section class="panel section"><h2>每日安排</h2><label for="capacity">每天可用時數</label><input id="capacity" type="number" min="0.1" max="24" step="0.1" value="2"><label for="horizon">排程範圍</label><select id="horizon"><option value="7">未來 7 天</option><option value="14" selected>未來 14 天</option><option value="30">未來 30 天</option><option value="90">未來 90 天</option></select><button id="plan" class="primary wide">更新排程</button><p class="hint">優先安排期限較近的作業，截止日當天也可安排。逾期作業請先調整期限。</p></section></aside>
<div><section class="panel"><div class="top"><h2>我的作業</h2><select id="filter" aria-label="篩選作業" style="width:auto"><option value="all">全部作業</option><option value="pending">待完成</option><option value="done">已完成</option></select></div><div id="tasks"></div></section><section class="panel section"><div class="top"><h2>接下來的安排</h2><button id="csv">匯出 CSV</button></div><p class="muted">排程是建議；完成後請回到作業清單記錄進度。</p><div id="warnings"></div><div id="schedule"></div></section></div></div><footer>離線使用 · 不需 API Key · 資料保存在目前瀏覽器，建議定期下載備份。<br>清除瀏覽器資料或更換檔案位置可能使原有資料無法讀取。</footer></main>
<dialog id="editor"><form id="editForm"><h2 id="editTitle"></h2><label id="editLabel" for="editValue"></label><input id="editValue" required><div class="dialogactions"><button type="button" id="cancel">取消</button><button class="primary">儲存</button></div></form></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id), KEY='study-planner-html-v1';
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>iso(new Date());
const after=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const h=n=>Number((n/60).toFixed(2));
const dateOK=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+'T12:00:00').getTime())&&iso(new Date(s+'T12:00:00'))===s;
function valid(d){if(!d||d.version!==1||!Number.isInteger(d.daily)||d.daily<6||d.daily>1440||![7,14,30,90].includes(d.days)||!Array.isArray(d.tasks)||d.tasks.length>10000)throw Error('備份格式不正確');const ids=new Set();for(const t of d.tasks){if(!t||typeof t.id!=='string'||ids.has(t.id)||typeof t.title!=='string'||!t.title.trim()||t.title.length>100||!dateOK(t.due)||!Number.isInteger(t.total)||t.total<1||!Number.isInteger(t.remaining)||t.remaining<0||t.remaining>t.total)throw Error('作業資料格式不正確');ids.add(t.id)}return d}
let state={version:1,daily:120,days:14,tasks:[]},storageBlocked=false;
try{const raw=localStorage.getItem(KEY);if(raw)state=valid(JSON.parse(raw))}catch(e){storageBlocked=true;$('status').textContent='無法讀取儲存資料：本次先使用暫存模式，請下載備份；原資料不會被覆蓋。'}
function notify(s){$('status').textContent=s}
function persist(){if(storageBlocked){notify('目前為暫存模式，請下載備份保存變更。');return}try{localStorage.setItem(KEY,JSON.stringify(state));notify('已儲存在目前瀏覽器。')}catch(e){notify('瀏覽器無法保存資料，請下載備份。')}}
function makeSchedule(data,start,days){const tasks=data.tasks.filter(t=>t.remaining>0).map(t=>({...t})).sort((a,b)=>a.due.localeCompare(b.due)||a.id.localeCompare(b.id));const rows=[];for(let i=0;i<days;i++){const d=new Date(start+'T12:00:00');d.setDate(d.getDate()+i);const day=iso(d);let cap=data.daily;for(const t of tasks){if(!cap)break;if(t.due<day||!t.remaining)continue;const amount=Math.min(cap,t.remaining);rows.push({day,title:t.title,minutes:amount,due:t.due});t.remaining-=amount;cap-=amount}}const end=new Date(start+'T12:00:00');end.setDate(end.getDate()+days-1);return {rows,warnings:tasks.filter(t=>t.remaining).map(t=>`${t.title}：${t.due<start?'已逾期，請調整期限':t.due<=iso(end)?'期限前時間不足':'超出排程範圍，尚未判定是否來得及'}；未排入 ${t.remaining} 分鐘。`)}}
let result;
function render(){const active=state.tasks.filter(t=>t.remaining);$('pending').textContent=active.length;$('hours').textContent=h(active.reduce((s,t)=>s+t.remaining,0));$('done').textContent=state.tasks.length-active.length;$('capacity').value=h(state.daily);$('horizon').value=state.days;const filter=$('filter').value;
const tasks=state.tasks.filter(t=>filter==='all'||(filter==='pending'?t.remaining>0:!t.remaining)).slice().sort((a,b)=>a.due.localeCompare(b.due));
$('tasks').innerHTML=tasks.length?tasks.map(t=>`<article class="task"><div class="taskhead"><h3>${esc(t.title)}</h3><span class="badge ${t.remaining&&t.due<today()?'late':''}">${!t.remaining?'已完成':t.due<today()?'已逾期':'進行中'}</span></div><div class="muted">${esc(t.due)} 截止 · 剩餘 ${h(t.remaining)} / ${h(t.total)} 小時</div><progress max="${t.total}" value="${t.total-t.remaining}" aria-label="完成進度"></progress><div class="toolbar">${t.remaining?`<button data-action="progress" data-id="${esc(t.id)}">記錄進度</button><button data-action="finish" data-id="${esc(t.id)}">標記完成</button>`:`<button data-action="reopen" data-id="${esc(t.id)}">重新開始</button>`}<button data-action="due" data-id="${esc(t.id)}">修改期限</button><button data-action="delete" data-id="${esc(t.id)}">刪除</button></div></article>`).join(''):'<div class="empty">目前沒有作業。<br>新增一份作業，或加入示範資料開始體驗。</div>';
result=makeSchedule(state,today(),state.days);$('warnings').innerHTML=result.warnings.map(w=>`<div class="warning">${esc(w)}</div>`).join('');const groups=new Map();result.rows.forEach(r=>{if(!groups.has(r.day))groups.set(r.day,[]);groups.get(r.day).push(r)});$('schedule').innerHTML=groups.size?[...groups].map(([day,rows])=>`<section class="day"><h3>${day} ${day===today()?'· 今天':''}<span class="muted">　${rows.reduce((s,r)=>s+r.minutes,0)} 分鐘</span></h3>${rows.map(r=>`<div class="entry"><span>${esc(r.title)}</span><span>${r.minutes} 分鐘</span></div>`).join('')}</section>`).join(''):'<div class="empty">目前沒有可安排的工作。</div>'}
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
$('today').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});$('due').value=after(3);
$('add').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim(),due=$('due').value,amount=Math.round(Number($('estimate').value)*60);if(!title||!dateOK(due)||!Number.isInteger(amount)||amount<6||amount>600000){notify('請輸入有效的名稱、日期與時數。');return}state.tasks.push({id:uid(),title,due,total:amount,remaining:amount});persist();$('title').value='';render()};
$('filter').onchange=render;
$('plan').onclick=()=>{const cap=Number($('capacity').value);if(!Number.isFinite(cap)||cap<0.1||cap>24){notify('每日時數須介於 0.1 到 24。');return}state.daily=Math.round(cap*60);state.days=Number($('horizon').value);persist();render()};
let editing=null;
$('tasks').onclick=e=>{const b=e.target.closest('button');if(!b)return;const t=state.tasks.find(t=>t.id===b.dataset.id);if(!t)return;const a=b.dataset.action;if(a==='delete'){if(!confirm(`刪除「${t.title}」？`))return;state.tasks=state.tasks.filter(x=>x!==t)}else if(a==='finish'){if(!confirm(`將「${t.title}」標記為全部完成？`))return;t.remaining=0}else if(a==='reopen'){if(!confirm('重新開始將恢復全部預估工時，確定嗎？'))return;t.remaining=t.total}else{editing={id:t.id,action:a};$('editTitle').textContent=t.title;const input=$('editValue');input.removeAttribute('min');input.removeAttribute('max');input.removeAttribute('step');input.setCustomValidity('');if(a==='due'){$('editLabel').textContent='新的截止日期';input.type='date';input.value=t.due}else{$('editLabel').textContent=`本次完成分鐘數（剩餘 ${t.remaining} 分鐘）`;input.type='number';input.min=1;input.max=t.remaining;input.step=1;input.value=Math.min(30,t.remaining)}$('editor').showModal();return}persist();render()};
$('cancel').onclick=()=>$('editor').close();$('editValue').oninput=()=>$('editValue').setCustomValidity('');
$('editForm').onsubmit=e=>{e.preventDefault();const t=state.tasks.find(t=>t.id===editing?.id);if(!t)return;if(editing.action==='due'){if(!dateOK($('editValue').value))return;t.due=$('editValue').value}else{const n=Number($('editValue').value);if(!Number.isInteger(n)||n<=0||n>t.remaining)return;t.remaining-=n}$('editor').close();persist();render()};
$('demo').onclick=()=>{if(state.tasks.length&&!confirm('將加入三項示範作業，保留原有作業。繼續嗎？'))return;[['數位邏輯作業',0,180],['Python 專案實作',2,240],['作業系統複習',4,120]].forEach(([title,day,total])=>state.tasks.push({id:uid(),title,due:after(day),total,remaining:total}));persist();render()};
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('backup').onclick=()=>download('study-planner-backup.json',JSON.stringify(state,null,2),'application/json');
$('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5000000)throw Error('備份不可超過 5 MB');const next=valid(JSON.parse(await file.text()));if(confirm(`匯入 ${next.tasks.length} 項作業，取代目前資料？建議先下載目前備份。`)){state=next;persist();render()}}catch(err){notify('匯入失敗：'+err.message)}finally{e.target.value=''}};
$('csv').onclick=()=>{result=makeSchedule(state,today(),state.days);const cell=s=>'"'+String(/^[\s]*[=+@-]/.test(String(s))?"'"+s:s).replace(/"/g,'""')+'"';const rows=[['日期','作業','分鐘','截止日'],...result.rows.map(r=>[r.day,r.title,r.minutes,r.due]),...result.warnings.map(w=>['提醒',w,'',''])];download('study-schedule.csv','\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')};
render();
</script></body></html>
